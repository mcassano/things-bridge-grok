name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_OBJECT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
          VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT" \
            --jq '.verification.verified == true and .verification.reason == "valid"')"
          test "$VERIFIED" = "true"
      - name: Tests and version check
        run: THINGS_TEST_PYTHON=/usr/bin/python3 ./tools/test.sh "$GITHUB_REF_NAME"
      - name: Native build checks
        run: |
          plutil -lint com.mcassano.grokbot-things.plist.template
          clang -Wall -Wextra -Werror -O2 \
            -DHELPER_SCRIPT='"/tmp/helper.py"' \
            -DWRITE_GATE_SCRIPT='"/tmp/write_gate.py"' \
            -DCONFIRM_HELPER='"/tmp/grokbot-things-confirm"' \
            -DBRIDGE_ROOT='"/tmp/things-bridge"' \
            -o /tmp/grokbot-things-helper bin/things_helper.c
          clang -Wall -Wextra -Werror -O2 -fobjc-arc \
            -framework AppKit -framework Foundation \
            -o /tmp/grokbot-things-confirm bin/confirm_things_change.m
      - name: Build checksummed source archives
        run: |
          mkdir -p dist
          PREFIX="things-bridge-grok-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$PREFIX/" -o "dist/$PREFIX.tar.gz" "$GITHUB_SHA"
          git archive --format=zip --prefix="$PREFIX/" -o "dist/$PREFIX.zip" "$GITHUB_SHA"
          (cd dist && shasum -a 256 "$PREFIX.tar.gz" "$PREFIX.zip" > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
